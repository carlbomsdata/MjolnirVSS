[package]
name = "mjolnirvss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MjolnirVSS portable bare metal backup for Windows"

# Produces MjolnirVSS.exe. The GUI opens when no arguments are given; the
# command line runs headless for automated testing and diagnostics.
[[bin]]
name = "MjolnirVSS"
path = "src/main.rs"

[dependencies]
mjolnir-core = { workspace = true }
mjolnir-image = { workspace = true }
mjolnir-storage = { workspace = true }
mjolnir-backup = { workspace = true }
mjolnir-media = { workspace = true }
mjolnir-files = { workspace = true }
mjolnir-ntfs = { workspace = true }
mjolnir-cli = { workspace = true }

[target.'cfg(windows)'.dependencies]
mjolnir-win32-ui = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }
