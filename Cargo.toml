[workspace]
resolver = "2"
members = [
    "crates/mjolnir-core",
    "crates/mjolnir-image",
    "crates/mjolnir-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/carlbomsdata/MjolnirVSS"
authors = ["MjolnirVSS contributors"]

[workspace.dependencies]
mjolnir-core = { path = "crates/mjolnir-core" }
mjolnir-image = { path = "crates/mjolnir-image" }
mjolnir-storage = { path = "crates/mjolnir-storage" }
mjolnir-vss = { path = "crates/mjolnir-vss" }
mjolnir-ntfs = { path = "crates/mjolnir-ntfs" }
mjolnir-backup = { path = "crates/mjolnir-backup" }
mjolnir-restore = { path = "crates/mjolnir-restore" }
mjolnir-win32-ui = { path = "crates/mjolnir-win32-ui" }
mjolnir-cli = { path = "crates/mjolnir-cli" }
mjolnir-testkit = { path = "crates/mjolnir-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
windows = "0.62"
windows-core = "0.62"

proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
