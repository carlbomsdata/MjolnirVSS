[workspace]
resolver = "2"
members = [
    "crates/mjolnir-core",
    "crates/mjolnir-image",
    "crates/mjolnir-storage",
    "crates/mjolnir-vss",
    "crates/mjolnir-ntfs",
    "crates/mjolnir-backup",
    "crates/mjolnir-restore",
    "crates/mjolnir-media",
    "crates/mjolnir-files",
    "crates/mjolnir-win32-ui",
    "crates/mjolnir-cli",
    "crates/mjolnir-crypto",
    "crates/mjolnir-testkit",
    "apps/mjolnirvss",
    "apps/mjolnirvss-restore",
    "tests/integration",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/carlbomsdata/MjolnirVSS"
authors = ["MjolnirVSS contributors"]

[workspace.dependencies]
mjolnir-core = { path = "crates/mjolnir-core" }
mjolnir-image = { path = "crates/mjolnir-image" }
mjolnir-storage = { path = "crates/mjolnir-storage" }
mjolnir-vss = { path = "crates/mjolnir-vss" }
mjolnir-ntfs = { path = "crates/mjolnir-ntfs" }
mjolnir-backup = { path = "crates/mjolnir-backup" }
mjolnir-restore = { path = "crates/mjolnir-restore" }
mjolnir-media = { path = "crates/mjolnir-media" }
mjolnir-files = { path = "crates/mjolnir-files" }
mjolnir-win32-ui = { path = "crates/mjolnir-win32-ui" }
mjolnir-cli = { path = "crates/mjolnir-cli" }
mjolnir-crypto = { path = "crates/mjolnir-crypto" }
mjolnir-testkit = { path = "crates/mjolnir-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# Cryptography, all from RustCrypto. Nothing here is written by this project:
# the password becomes a key with Argon2id, and chunks are sealed with
# AES-256-GCM, both used through their own crates in the documented way.
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
windows = "0.62"
windows-core = "0.62"

proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
